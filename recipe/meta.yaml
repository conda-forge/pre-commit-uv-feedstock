{% set name = "pre-commit-uv" %}
{% set version = "4.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pre_commit_uv-{{ version }}.tar.gz
  sha256: a29a29fe2e0b294ba5a75e28b0ca7804eb04609129603b1897411e44aed8701c

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - pip
  run:
    - python >={{ python_min }}
    - pre-commit >=4.6.2
    - python-uv >=0.12.22

test:
  imports:
    - pre_commit_uv
  requires:
    - python {{ python_min }}
  commands:
    - uv pip check

about:
  home: https://github.com/tox-dev/pre-commit-uv
  summary: Run pre-commit with uv
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - anjos
